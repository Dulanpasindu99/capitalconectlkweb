<!-- Shared floating WhatsApp chat widget.
     Loaded by assets/include.js via <div data-include="whatsapp-widget"></div>.
     Behaviour lives in assets/whatsapp-widget.js; styles are the .whatsapp-* rules in styles.css.
     Change the target number in ONE place: the data-wa-link attribute below (JS copies it to the CTA). -->
<div class="whatsapp-widget" data-wa-link="https://wa.me/94723652618">
  <div class="whatsapp-panel" id="whatsapp-panel" hidden aria-hidden="true">
    <div class="whatsapp-panel__header">
      <div class="whatsapp-panel__avatar" aria-hidden="true">
        <img src="assets/whatsapp-icon.svg" alt="" width="26" height="26">
      </div>
      <div class="whatsapp-panel__title">
        <strong>Capital Connect LK</strong>
        <span class="whatsapp-panel__status">We're online</span>
      </div>
      <button class="whatsapp-close" type="button" aria-label="Close WhatsApp chat">✕</button>
    </div>
    <div class="whatsapp-panel__body">
      <div class="whatsapp-panel__message">Hi there! Need curated investor introductions or have a question about our intake? Start a WhatsApp chat and we&rsquo;ll get back fast.</div>
      <a class="whatsapp-panel__cta" href="https://wa.me/94723652618" target="_blank" rel="noopener">Open WhatsApp</a>
      <p class="whatsapp-panel__note">WhatsApp opens in a new tab. Prefer email? Reach us at <a href="mailto:capitalconnectlk@gmail.com">capitalconnectlk@gmail.com</a>.</p>
    </div>
  </div>
  <button class="whatsapp-toggle" type="button" aria-expanded="false" aria-controls="whatsapp-panel">
    <span class="toggle-icon" aria-hidden="true">
      <img src="assets/whatsapp-icon.svg" alt="" width="22" height="22">
    </span>
    <span class="toggle-copy">
      <strong>Chat with us</strong>
      <span>WhatsApp</span>
    </span>
  </button>
</div>
